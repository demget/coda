name: Release Coda Desktop

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even when main has not moved since the last release
        required: false
        default: false
        type: boolean

concurrency:
  group: downstream-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Read release checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      official_tag: ${{ steps.metadata.outputs.official_tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      # Direct Git checkout avoids credential cleanup traversing vendored gitlinks.
      - name: Checkout Coda main
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --filter=blob:none origin "$CHECKOUT_REF" '+refs/tags/*:refs/tags/*'
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach "$CHECKOUT_REF"

      - id: metadata
        name: Resolve release metadata
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          snapshot="$(jq -er .version .coda-upstream/upstream.json)"
          official_tag="$(jq -er .nightlyTag .coda-upstream/upstream.json)"
          source_sha="$(git rev-parse HEAD)"
          [[ "$snapshot" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+\.coda\.[0-9]+\.[0-9]+$ ]]
          [[ "$official_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]

          # The recorded snapshot only moves when an upstream sync lands, so it
          # cannot identify a release built from our own commits. Append this
          # run's number the way the official Release workflow stamps a nightly,
          # which keeps every build newer than the last one for the updater
          # while the snapshot still names the sync it came from.
          version="$snapshot.$GITHUB_RUN_NUMBER"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "official_tag=$official_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Skipping." >&2
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${FORCE:-}" == "true" ]]; then
            echo "Forced release requested. Proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --count caps the output at the source; piping through `head` would
          # break this step under `pipefail` once enough tags exist to fill the
          # pipe buffer before `head` closes it.
          last_tag="$(git for-each-ref --count=1 --sort=-creatordate \
            --format='%(refname:short)' 'refs/tags/v*-nightly.*.coda.*')"
          if [[ -z "$last_tag" ]]; then
            echo "No previous release tag found. Proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="$(git rev-parse "$last_tag^{commit}")"
          if [[ "$last_sha" == "$source_sha" ]]; then
            echo "No changes on main since $last_tag. Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected since $last_tag ($last_sha → $source_sha). Proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release source
    needs: source
    if: needs.source.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach "$CHECKOUT_REF"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/web...
              - --filter=@t3tools/contracts...
              - --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run focused release tests
        run: |
          (cd scripts && vp test run downstream-sync.test.ts build-desktop-artifact.test.ts)
          (cd apps/desktop && vp test run --passWithNoTests \
            src/app/DesktopEnvironment.test.ts \
            src/updates/updateChannels.test.ts \
            src/updates/DesktopUpdates.test.ts)
          (cd apps/web && vp test run --passWithNoTests --project unit \
            src/branding.test.ts \
            src/components/desktopUpdate.logic.test.ts)

      - name: Typecheck desktop surfaces
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

  build_desktop:
    name: Build macOS arm64
    needs: [source, validate]
    if: needs.source.outputs.should_release == 'true' && needs.validate.result == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.source.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach "$CHECKOUT_REF"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=coda...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Align package versions
        shell: bash
        env:
          OFFICIAL_TAG: ${{ needs.source.outputs.official_tag }}
        run: node scripts/update-release-package-versions.ts "${OFFICIAL_TAG#v}"

      - name: Build desktop artifact
        shell: bash
        env:
          CODA_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 \
            --build-version "${{ needs.source.outputs.version }}" --mac-updater-adhoc --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          test -f release-publish/nightly-mac.yml
          compgen -G 'release-publish/*.dmg' >/dev/null

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish desktop release
    needs: [source, build_desktop]
    if: needs.source.outputs.should_release == 'true' && needs.build_desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_TAG: ${{ needs.source.outputs.official_tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/release-assets/nightly-mac.yml"
          compgen -G "$RUNNER_TEMP/release-assets/*.dmg" >/dev/null
          notes="Coda desktop for macOS (Apple silicon), built from ${RELEASE_SHA:0:7}, synced through official $OFFICIAL_TAG. Install the DMG manually once; later nightly versions update in-app. The build uses an updater-compatible ad-hoc signature and is not Apple-notarized."
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Coda $RELEASE_VERSION" \
            --notes "$notes" \
            --prerelease
