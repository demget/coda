name: Release Coda Desktop

on:
  push:
    branches:
      - main
    paths:
      - .coda-upstream/upstream.json
  workflow_dispatch:

concurrency:
  group: downstream-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source:
    name: Read release checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.metadata.outputs.already_published }}
      official_tag: ${{ steps.metadata.outputs.official_tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout Coda main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - id: metadata
        name: Validate release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -er .version .coda-upstream/upstream.json)"
          official_tag="$(jq -er .nightlyTag .coda-upstream/upstream.json)"
          source_sha="$(git rev-parse HEAD)"
          tag="v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+\.coda\.[0-9]+\.[0-9]+$ ]]
          [[ "$official_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "official_tag=$official_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate release source
    needs: source
    if: needs.source.outputs.already_published == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/.claude/worktrees/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/web...
              - --filter=@t3tools/contracts...
              - --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Run focused release tests
        run: |
          (cd scripts && vp test run downstream-sync.test.ts build-desktop-artifact.test.ts)
          (cd apps/desktop && vp test run --passWithNoTests \
            src/app/DesktopEnvironment.test.ts \
            src/updates/DesktopUpdates.test.ts)
          (cd apps/web && vp test run --passWithNoTests --project unit \
            src/branding.test.ts \
            src/components/desktopUpdate.logic.test.ts)

      - name: Typecheck desktop surfaces
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/desktop typecheck
          vp run --filter @t3tools/web typecheck

  build_wsl_node_pty:
    name: Build WSL node-pty
    needs: [source, validate]
    if: needs.source.outputs.already_published == 'false' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/.claude/worktrees/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=coda...

      - name: Build Linux x64 node-pty prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload WSL prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 3

  build_desktop:
    name: Build ${{ matrix.label }}
    needs: [source, build_wsl_node_pty]
    if: needs.source.outputs.already_published == 'false' && needs.build_wsl_node_pty.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/.claude/worktrees/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=coda...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download WSL prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            $code = if ($null -ne $process) { $process.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions
        shell: bash
        env:
          OFFICIAL_TAG: ${{ needs.source.outputs.official_tag }}
        run: node scripts/update-release-package-versions.ts "${OFFICIAL_TAG#v}"

      - name: Build unsigned desktop artifact
        shell: bash
        env:
          CODA_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.source.outputs.version }}"
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            test -f release-publish/nightly-mac.yml
            compgen -G 'release-publish/*.dmg' >/dev/null
          else
            test -f release-publish/nightly.yml
            compgen -G 'release-publish/*.exe' >/dev/null
          fi

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish desktop release
    needs: [source, build_desktop]
    if: needs.source.outputs.already_published == 'false' && needs.build_desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_TAG: ${{ needs.source.outputs.official_tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/release-assets/nightly.yml"
          test -f "$RUNNER_TEMP/release-assets/nightly-mac.yml"
          compgen -G "$RUNNER_TEMP/release-assets/*.exe" >/dev/null
          compgen -G "$RUNNER_TEMP/release-assets/*.dmg" >/dev/null
          notes="Coda desktop release synced through official $OFFICIAL_TAG. macOS arm64 and Windows x64 builds are unsigned."
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* \
            --target "$RELEASE_SHA" \
            --title "Coda $RELEASE_VERSION" \
            --notes "$notes" \
            --prerelease
